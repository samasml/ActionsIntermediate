---
name: Concurrency Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  upload-tree:
    runs-on: ubuntu-latest    
    steps:
       - name: Checkout
         uses: actions/checkout@v4.2.2
       - name: List file in the repo
         run: |
              echo "::group::The repository ${{ github.repository }} contains the following files"
              echo "Inside group"
              tree > files.txt
              cat files.txt
              echo "::endgroup::"
       - name: Upload tree output
         uses: actions/upload-artifact@v4.6.2
         with:
           name: tree-output
           path: files.txt

       - name: Simulate work
         run: sleep 10
    
  add-summary:
    runs-on: ubuntu-latest
    needs: upload-tree
    steps:
     - name: Download artifact
       uses: actions/download-artifact@v4.3.0
       with:
         name: tree-output

     - name: Sleep
       run: sleep 10

     - name: Add job summary with tree output
       run: |
         echo "### Job completed :rocket:" >> $GITHUB_STEP_SUMMARY
      
    
         

     
  
        
        
        
        
